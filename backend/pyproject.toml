[project]
name = "medcite-backend"
version = "0.1.0"
description = "MedCite: cited, evidence-graded answers from PubMed and PMC literature"
readme = "../README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Web / API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    # Data stores
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "pgvector>=0.4",
    "alembic>=1.13",
    "redis>=5.0",
    # External calls
    "httpx>=0.27",
    "tenacity>=8.5",
    "lxml>=5.2",
    # LLM access (OpenAI-compatible SDK; used for Groq via base_url)
    "openai>=1.40",
    # Orchestration
    "langgraph>=0.2",
    # Models (MedCPT) and clustering
    "torch>=2.3",
    "transformers>=4.44",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    # Auth
    "pyjwt[crypto]>=2.9",
    # Observability
    "langfuse>=2.50",
    "sentry-sdk[fastapi]>=2.10",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
]

# PyTorch CPU wheels on Linux; macOS uses the default PyPI wheels.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "ASYNC", "S", "RUF", "SIM", "PT"]
ignore = [
    "S101",  # assert is fine in tests (scoped below)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S608"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
# Third-party libraries without type stubs. Each entry must stay justified.
module = ["transformers.*", "pgvector.*", "langfuse.*", "sklearn.*", "redis.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs the Compose Postgres and Redis (docker compose up -d db redis)",
    "live: calls real external services (NCBI, Groq); never run by default",
]
addopts = "-m 'not live'"
